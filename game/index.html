<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Wok - Night Market Cooking</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ember Wok: a night-market cooking game. Read the ticket on the order board, tap the ticket's four ingredients on the shelf, chop them on the board, stir the wok to keep the heat needle in the green, plate the dish, garnish it and serve it before the customer's patience runs out."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
